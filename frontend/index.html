<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foto de producto</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bdb'/%3E%3Crect x='7' y='9' width='18' height='14' rx='2' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%233b5bdb'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>Foto de producto</h1>
        <p>Dejá la foto de tu producto lista para publicar</p>
      </div>
    </div>
    <div class="topbar-right">
      <a class="link" href="/docs" id="link-docs" target="_blank" rel="noopener">Documentación de la API</a>
      <span class="status" id="server-status" data-status="checking">
        <span class="dot"></span><span class="status-text">Conectando con el servidor…</span>
      </span>
    </div>
  </header>

  <main class="layout">
    <!-- Columna izquierda: carga + trabajos guardados -->
    <aside class="panel" aria-labelledby="trabajos-title">
      <div class="panel-head">
        <h2 id="trabajos-title">Tus fotos</h2>
      </div>

      <label class="dropzone" id="dropzone" for="file-input">
        <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/bmp" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M8 9h8M8 12h8M8 15h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <strong>Subí la foto de tu producto</strong>
        <span>Arrastrala acá o hacé clic · PNG, JPG, WEBP o BMP · máx. 10 MB</span>
      </label>

      <div class="gallery" id="gallery" aria-live="polite">
        <div class="notice">Todavía no guardaste ninguna foto.</div>
      </div>
    </aside>

    <!-- Centro: tu foto vs. cómo va a quedar -->
    <section class="panel panel-view" aria-label="Tu foto y el resultado">
      <div class="comparison">
        <figure class="canvas">
          <figcaption>
            <span class="caption-label">Tu foto</span>
            <span class="meta" id="photo-meta"></span>
          </figcaption>
          <div class="frame" id="photo-frame">
            <div class="empty">Subí una foto para empezar</div>
          </div>
        </figure>

        <figure class="canvas">
          <figcaption>
            <span class="caption-label">Cómo va a quedar</span>
            <span class="meta" id="result-meta"></span>
          </figcaption>
          <div class="frame frame-paper" id="result-frame">
            <div class="empty">Acá vas a ver el resultado</div>
          </div>
        </figure>
      </div>
    </section>

    <!-- Columna derecha: opciones (se suman a medida que se implementan) -->
    <aside class="panel" aria-labelledby="opciones-title">
      <div class="panel-head">
        <h2 id="opciones-title">Opciones</h2>
      </div>
      <div class="notice">Las opciones para preparar tu foto van a aparecer acá.</div>
    </aside>
  </main>

  <div class="toasts" id="toasts" aria-live="assertive"></div>

  <script src="app.js"></script>
</body>
</html>
